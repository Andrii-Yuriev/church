{% extends "base.html" %}

{% block title %}{{ view_title }}{% endblock %}

{% block content %}
  <h1>{{ view_title }}</h1>

  <form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Save</button>
    {% if cancel_url %}
      <a href="{{ cancel_url }}">Cancel</a>
    {% endif %}
  </form>

{% endblock %}
